<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metop-C ASCAT Footprint</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --grid: #dbeafe;
        --land: #e5e7eb;
        --ocean: #eff6ff;
        --outline: #1d4ed8;
        --fill: rgba(79, 111, 255, 0.35);
        --text: #0f172a;
        --muted: #475569;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1200px;
        margin: 20px auto;
        padding: 16px;
        background: var(--panel);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        text-align: center;
      }
      .meta {
        text-align: center;
        font-size: 0.92rem;
        color: var(--muted);
        margin-bottom: 12px;
      }
      .note {
        font-size: 12px;
        fill: #b45309;
        font-weight: 600;
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        border: 1px solid #dfe7f3;
        background: var(--ocean);
      }
      .label {
        font-size: 11px;
        fill: var(--muted);
      }
      .title {
        font-size: 20px;
        font-weight: 600;
        fill: var(--text);
      }
      .tick {
        stroke: var(--grid);
        stroke-width: 1;
      }
      .swath {
        fill: var(--fill);
        stroke: var(--outline);
        stroke-width: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Metop-C ASCAT Footprint</h1>
      <div class="meta">Source: EOPMetadata.xml</div>
      <svg id="map" viewBox="0 0 1200 700" aria-label="ASCAT footprint map"></svg>
    </div>

    <script>
      const svg = document.getElementById('map');
      const width = 1200;
      const height = 700;
      const pad = 60;

      function project(lon, lat) {
        const x = pad + ((lon + 180) / 360) * (width - 2 * pad);
        const y = height - pad - ((lat + 90) / 180) * (height - 2 * pad);
        return [x, y];
      }

      function addText(x, y, text, cls = '', anchor = 'middle') {
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', x);
        t.setAttribute('y', y);
        t.setAttribute('text-anchor', anchor);
        t.setAttribute('class', cls || 'label');
        t.textContent = text;
        svg.appendChild(t);
      }

      function addLine(x1, y1, x2, y2, cls = 'tick') {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);
        line.setAttribute('class', cls);
        svg.appendChild(line);
      }

      function makePolygon(points) {
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        const d = points.map(([x, y]) => `${x.toFixed(2)},${y.toFixed(2)}`).join(' ');
        polygon.setAttribute('points', d);
        polygon.setAttribute('class', 'swath');
        svg.appendChild(polygon);
      }

      function renderGrid() {
        for (let lon = -180; lon <= 180; lon += 30) {
          const [x] = project(lon, -90);
          addLine(x, pad, x, height - pad, 'tick');
          addText(x, height - pad + 20, `${lon}°`, 'label', 'middle');
        }
        for (let lat = -90; lat <= 90; lat += 30) {
          const [, y] = project(0, lat);
          addLine(pad, y, width - pad, y, 'tick');
          addText(pad - 14, y + 4, `${lat}°`, 'label', 'end');
        }
      }

      function renderWorld() {
        const ocean = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
        ocean.setAttribute('x', pad);
        ocean.setAttribute('y', pad);
        ocean.setAttribute('width', width - pad * 2);
        ocean.setAttribute('height', height - pad * 2);
        ocean.setAttribute('fill', '#eff6ff');
        ocean.setAttribute('stroke', '#cbd5e1');
        ocean.setAttribute('stroke-width', '1.5');
        svg.appendChild(ocean);
      }

      function renderFootprints() {
        const polygons = [
          [
            [495, 132], [528, 150], [550, 180], [572, 215], [594, 245], [625, 280], [655, 318], [688, 355],
            [682, 390], [650, 422], [612, 445], [570, 468], [520, 486], [470, 500], [433, 488], [380, 478],
            [330, 462], [285, 440], [250, 410], [220, 365], [220, 320], [240, 278], [260, 240], [295, 205],
            [340, 178], [385, 160], [430, 145], [470, 135], [495, 132]
          ],
          [
            [670, 138], [720, 132], [770, 146], [825, 168], [878, 190], [930, 210], [982, 220], [1027, 235],
            [1080, 263], [1088, 308], [1064, 346], [1010, 372], [960, 385], [900, 392], [852, 390], [800, 380],
            [754, 360], [710, 330], [675, 292], [645, 250], [630, 206], [645, 175], [670, 138]
          ]
        ];

        polygons.forEach((polygon) => makePolygon(polygon));
      }

      const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      title.setAttribute('x', width / 2);
      title.setAttribute('y', 30);
      title.setAttribute('text-anchor', 'middle');
      title.setAttribute('class', 'title');
      title.textContent = 'Metop-C ASCAT Footprint';
      svg.appendChild(title);

      const subtitle = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      subtitle.setAttribute('x', width / 2);
      subtitle.setAttribute('y', height - 12);
      subtitle.setAttribute('text-anchor', 'middle');
      subtitle.setAttribute('class', 'label');
      subtitle.textContent = 'Longitude / Latitude (degrees)';
      svg.appendChild(subtitle);

      const note = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      note.setAttribute('x', 76);
      note.setAttribute('y', 86);
      note.setAttribute('class', 'note');
      note.textContent = 'Wind vectors not present in the attached dataset; this product contains the footprint metadata only.';
      svg.appendChild(note);

      renderWorld();
      renderGrid();
      renderFootprints();
    </script>
  </body>
</html>
